name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ipbp-${{ matrix.os }}
          path: |
            build/ipbp
            build/Release/ipbp.exe

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        san: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIPBP_BUILD_CLI=OFF -DCMAKE_CXX_FLAGS="-O1 -fno-omit-frame-pointer -fsanitize=${{ matrix.san }}"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --timeout 1200
